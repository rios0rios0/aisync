kind: 'Added'
body: 'added per-device exclusions: `<tool>/<path>` lines in `~/.config/aisync/exclude` (or the file `AISYNC_EXCLUDE_FILE` names), kept outside the sync repo, opt a path out of pull, push, sync, conversations, `diff` and `status` on that device alone, so a phone can keep its own `settings.json` while every other device goes on sharing it'
